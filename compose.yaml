# Convenience wrapper so the whole thing is `docker compose up`.
# Production deploys can use the Dockerfile directly and ignore this file.

services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
    restart: unless-stopped
    healthcheck:
      # The app has no /api/health route, so this just asks the server for the
      # page it serves. Enough to tell a restarting container from a wedged one.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
