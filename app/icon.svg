<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="V">
  <!--
    Theme-aware: the fill swaps so the mark stays legible against dark browser
    chrome as well as light. Sand-on-sienna is 5.17:1, chocolate-on-ochre 7.57:1.
    The V reads as the initial and as a descending path — the tagline's "road".
  -->
  <style>
    .bg { fill: #8f4c2c }
    .mark { fill: none; stroke: #ece5d5; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #dcab6b }
      .mark { stroke: #301f14 }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <path class="mark" d="M8.6 10.4 L16 22.2 L23.4 10.4"/>
</svg>
